version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: hyexam
      POSTGRES_USER: hyexam
      POSTGRES_PASSWORD: hyexam123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://hyexam:hyexam123@db:5432/hyexam
    depends_on:
      - db
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data: